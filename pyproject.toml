[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maeckeater-cold_start_load_time_timeline_score"
version = "0.1.0"
description = "解析时间标记，排列Agent 应用开发工程师·冷启动与模型加载时间的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "maeckeater" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://maeckeater.github.io"
Repository = "https://github.com/maeckeater/cold_start_load_time_timeline_score"
Issues = "https://github.com/maeckeater/cold_start_load_time_timeline_score/issues"

[project.scripts]
cold_start_load_time_timeline_score = "cold_start_load_time_timeline_score:main"

[tool.setuptools]
py-modules = ["cold_start_load_time_timeline_score"]
